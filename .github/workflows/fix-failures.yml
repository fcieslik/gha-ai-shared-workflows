name: Fix failures

on:
  workflow_call:
    inputs:
      source_run_id:
        description: Identifier of the caller workflow run.
        required: true
        type: string
      source_run_attempt:
        description: Attempt number of the caller workflow run.
        required: true
        type: string
      source_workflow:
        description: Name of the caller workflow.
        required: true
        type: string
      source_ref:
        description: Branch or ref of the caller workflow.
        required: false
        type: string
      source_sha:
        description: Revision used when the caller has no branch or ref.
        required: true
        type: string

permissions:
  actions: read

jobs:
  fix-failures:
    runs-on: ubuntu-latest
    concurrency:
      group: >-
        fix-failures-${{ inputs.source_workflow }}-
        ${{ inputs.source_ref || inputs.source_sha }}
      cancel-in-progress: true
    steps:
      - name: Fetch failed jobs from the caller attempt
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/attempts/${SOURCE_RUN_ATTEMPT}/jobs?per_page=100" \
            > "$RUNNER_TEMP/source-jobs.json"
          jq -c '.[] | .jobs[]? | select(.conclusion == "failure") |
            {id, name, conclusion, failed_steps: [.steps[]? | select(.conclusion == "failure") | .name]}' \
            "$RUNNER_TEMP/source-jobs.json"
          jq -r '.[] | .jobs[]? | select(.conclusion == "failure") | .id' \
            "$RUNNER_TEMP/source-jobs.json" > "$RUNNER_TEMP/failed-job-ids.txt"

      - name: Fetch logs for every failed job
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          while IFS= read -r job_id; do
            [ -n "$job_id" ] || continue
            # Job logs are plain text that keeps ANSI colour codes from the failed steps.
            gh api --allow-escape-sequences \
              "repos/${GITHUB_REPOSITORY}/actions/jobs/${job_id}/logs" \
              > "$RUNNER_TEMP/failed-job-${job_id}.log"
          done < "$RUNNER_TEMP/failed-job-ids.txt"

      - name: Show collected logs in the job summary
        env:
          # GitHub rejects step summaries above 1 MiB; the rest is left for headings.
          SUMMARY_LOG_BUDGET_BYTES: "900000"
        run: |
          set -euo pipefail
          if [ ! -s "$RUNNER_TEMP/failed-job-ids.txt" ]; then
            echo "No failed jobs found in the source attempt." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          failed_job_count=$(grep -c . "$RUNNER_TEMP/failed-job-ids.txt")
          max_log_bytes=$(( SUMMARY_LOG_BUDGET_BYTES / failed_job_count ))
          while IFS= read -r job_id; do
            [ -n "$job_id" ] || continue
            job_name=$(jq -r --argjson id "$job_id" \
              '.[] | .jobs[]? | select(.id == $id) | .name' "$RUNNER_TEMP/source-jobs.json")
            plain_log="$RUNNER_TEMP/failed-job-${job_id}.plain.log"
            # Strip ANSI colour codes, which Markdown renders as garbage, and make sure
            # the log ends with a newline so the closing fence stays on its own line.
            sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g' \
              "$RUNNER_TEMP/failed-job-${job_id}.log" > "$plain_log"
            [ -z "$(tail -c 1 "$plain_log")" ] || echo >> "$plain_log"
            log_bytes=$(wc -c < "$plain_log")
            # A five-backtick fence survives triple-backtick blocks inside the log.
            {
              if [ "$log_bytes" -le "$max_log_bytes" ]; then
                echo "### ${job_name} (job ${job_id})"
                echo
                echo '`````text'
                cat "$plain_log"
              else
                echo "### ${job_name} (job ${job_id}), last ${max_log_bytes} of ${log_bytes} bytes"
                echo
                echo '`````text'
                # The failure is near the end of the log; drop the line the byte cut split.
                tail -c "$max_log_bytes" "$plain_log" | tail -n +2
              fi
              echo '`````'
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          done < "$RUNNER_TEMP/failed-job-ids.txt"
