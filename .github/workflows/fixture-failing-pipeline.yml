name: Fixture failing pipeline

on:
  workflow_dispatch:
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  fail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Calculate cart total
        run: node fixtures/failing-pipeline/fails.js

  collect-failure-diagnostics:
    if: ${{ failure() }}
    needs: fail
    uses: ./.github/workflows/fix-failures.yml
    with:
      source_run_id: ${{ github.run_id }}
      source_run_attempt: ${{ github.run_attempt }}
      source_workflow: ${{ github.workflow }}
      source_ref: ${{ github.head_ref || github.ref }}
      source_sha: ${{ github.sha }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # Optional: without them the proposed fix is not commented on the pull request.
      FIX_FAILURES_APP_CLIENT_ID: ${{ secrets.FIX_FAILURES_APP_CLIENT_ID }}
      FIX_FAILURES_APP_PRIVATE_KEY: ${{ secrets.FIX_FAILURES_APP_PRIVATE_KEY }}
